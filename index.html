<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshy App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0fdf4; overflow-x: hidden; }
        .fresh-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .app-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #d1fae5; }
        .app-card:hover { transform: translateY(-8px); box-shadow: 0 20px 30px -10px rgba(5, 150, 105, 0.15); }
        .app-icon { width: 95px; height: 95px; border-radius: 24px; object-fit: cover; border: 4px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .modal { display: none; background: rgba(6, 78, 59, 0.4); backdrop-filter: blur(12px); }
        .modal.active { display: flex; }
        .fav-heart { transition: all 0.2s; cursor: pointer; }
        .fav-heart:active { transform: scale(1.6); }
        .share-menu { display: none; position: absolute; right: 0; top: 45px; width: 170px; background: white; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); z-index: 50; overflow: hidden; }
        .share-menu.active { display: block; }
        /* Favorites Drawer */
        #favDrawer.open { transform: translateX(0); }
    </style>
</head>
<body onload="initApp()">

    <header class="fresh-gradient pb-28 pt-8 px-4 relative text-white text-center">
        <div class="container mx-auto max-w-5xl">
            <div class="flex justify-between items-center mb-12">
                <div class="flex items-center gap-2">
                    <div class="bg-white p-2 rounded-xl shadow-lg"><i class="fas fa-leaf text-emerald-600 text-lg"></i></div>
                    <span class="text-2xl font-black italic tracking-tighter">FRESHY</span>
                </div>
                <div id="authSection">
                    <button onclick="toggleAuthModal()" class="bg-white text-emerald-700 px-7 py-2.5 rounded-full font-extrabold text-sm shadow-xl">Login</button>
                </div>
            </div>
            
            <h1 class="text-4xl font-black mb-8 italic drop-shadow-md">Freshy <span class="text-emerald-200">Store</span></h1>
            <div class="max-w-lg mx-auto flex bg-white rounded-[1.5rem] shadow-2xl p-2 border-4 border-emerald-400/20">
                <input id="searchInput" type="text" placeholder="Search apps..." class="w-full px-5 py-3 text-gray-800 outline-none font-bold">
                <button onclick="searchApps()" class="bg-emerald-600 text-white px-8 rounded-2xl font-black hover:bg-emerald-700 transition-colors">Find</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto -mt-12 px-4 pb-24 relative z-10">
        <div id="loading" class="hidden text-center py-20"><div class="inline-block w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div></div>
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="favDrawer" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl z-[200] transform translate-x-full transition-transform duration-300 ease-in-out p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-emerald-800 italic">My Favorites 🥬</h2>
            <button onclick="toggleFavDrawer()" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="favList" class="grid gap-4"></div>
    </div>
    <div id="drawerOverlay" onclick="toggleFavDrawer()" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-[190] hidden"></div>

    <div id="authModal" class="modal fixed inset-0 z-[210] items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-10 shadow-2xl relative text-center">
            <button onclick="toggleAuthModal()" class="absolute top-6 right-6 text-gray-400"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-2xl font-black text-gray-800 mb-8 italic">Freshy Login</h2>
            <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-100 py-4 rounded-2xl font-black text-gray-600 mb-4 hover:bg-gray-50 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6"> Continue with Google
            </button>
            <div class="flex items-center gap-3 mb-4 opacity-20"><hr class="flex-grow"> <span class="text-xs font-bold">OR</span> <hr class="flex-grow"></div>
            <input id="authEmail" type="email" placeholder="Email Address" class="w-full bg-emerald-50 border-0 rounded-2xl px-4 py-4 mb-4 outline-none text-center font-bold text-sm">
            <button onclick="handleEmailLogin()" id="loginBtn" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg">Magic Link 🪄</button>
            <p id="authMsg" class="mt-4 text-xs font-bold text-emerald-600"></p>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDN39buxTWf_p2MLNMvSZwNwP8ivlhRo7M",
            authDomain: "freshy-store-123.firebaseapp.com",
            projectId: "freshy-store-123",
            storageBucket: "freshy-store-123.firebasestorage.app",
            messagingSenderId: "686226406887",
            appId: "1:686226406887:web:403fcccb78540a5de0d142"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let userFavorites = [];

        function initApp() {
            auth.onAuthStateChanged(async user => {
                const authSection = document.getElementById('authSection');
                if (user) {
                    authSection.innerHTML = `
                        <div class="flex items-center gap-3 bg-white/10 p-1 pr-4 rounded-full border border-white/20">
                            <button onclick="toggleFavDrawer()" class="relative">
                                <img src="${user.photoURL || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full border-2 border-white shadow-md active:scale-90 transition-all">
                                <div class="absolute -top-1 -right-1 bg-emerald-500 w-4 h-4 rounded-full border-2 border-white flex items-center justify-center">
                                    <i class="fas fa-heart text-[7px] text-white"></i>
                                </div>
                            </button>
                            <button onclick="handleLogout()" class="text-white font-black text-[10px] uppercase opacity-80 hover:opacity-100">Exit</button>
                        </div>`;
                    const snapshot = await db.collection('users').doc(user.uid).collection('favorites').get();
                    userFavorites = snapshot.docs.map(doc => doc.id);
                } else {
                    authSection.innerHTML = `<button onclick="toggleAuthModal()" class="bg-white text-emerald-700 px-7 py-2.5 rounded-full font-extrabold text-sm shadow-xl">Login</button>`;
                    userFavorites = [];
                }
                searchApps();
            });
        }

        // --- AUTH ---
        async function handleGoogleLogin() {
            try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); toggleAuthModal(); } catch (e) { alert("Login failed"); }
        }
        async function handleEmailLogin() {
            const email = document.getElementById('authEmail').value;
            try {
                await auth.sendSignInLinkToEmail(email, { url: window.location.href, handleCodeInApp: true });
                window.localStorage.setItem('emailForSignIn', email);
                document.getElementById('authMsg').innerText = "Check your email! 📧";
            } catch (e) { document.getElementById('authMsg').innerText = "Error sending link"; }
        }
        function handleLogout() { auth.signOut().then(() => window.location.reload()); }
        function toggleAuthModal() { document.getElementById('authModal').classList.toggle('active'); }

        // --- FAVORITES DRAWER ---
        function toggleFavDrawer() {
            document.getElementById('favDrawer').classList.toggle('translate-x-full');
            document.getElementById('drawerOverlay').classList.toggle('hidden');
            if (!document.getElementById('favDrawer').classList.contains('translate-x-full')) renderFavList();
        }

        async function renderFavList() {
            const list = document.getElementById('favList');
            const user = auth.currentUser;
            if (!user) return;
            const snapshot = await db.collection('users').doc(user.uid).collection('favorites').get();
            if (snapshot.empty) { list.innerHTML = `<p class="text-xs text-gray-400 text-center py-20">No favorites yet! 🥬</p>`; return; }
            list.innerHTML = snapshot.docs.map(doc => {
                const d = doc.data();
                return `<div class="flex items-center gap-4 p-4 bg-emerald-50 rounded-[1.5rem] border border-emerald-100">
                    <img src="${d.icon}" class="w-12 h-12 rounded-xl shadow-sm">
                    <div class="flex-grow min-w-0"><p class="text-sm font-black text-emerald-900 truncate">${d.name}</p>
                    <button onclick="toggleFavorite('${doc.id}', '${d.name}', '${d.icon}')" class="text-[10px] font-bold text-red-400">Remove</button></div>
                </div>`;
            }).join('');
        }

        // --- CORE LOGIC ---
        async function toggleFavorite(appId, name, icon) {
            const user = auth.currentUser;
            if (!user) { toggleAuthModal(); return; }
            const favRef = db.collection('users').doc(user.uid).collection('favorites').doc(appId.toString());
            if (userFavorites.includes(appId.toString())) {
                await favRef.delete();
                userFavorites = userFavorites.filter(id => id !== appId.toString());
            } else {
                await favRef.set({ name, icon, date: new Date() });
                userFavorites.push(appId.toString());
            }
            searchApps(); renderFavList();
        }

        async function searchApps() {
            const q = document.getElementById('searchInput').value || 'apps';
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            grid.innerHTML = ''; loader.classList.remove('hidden');
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=software&limit=12`);
                const data = await res.json();
                loader.classList.add('hidden');
                data.results.forEach((app, i) => {
                    const isFav = userFavorites.includes(app.trackId.toString());
                    const card = document.createElement('div');
                    card.className = "app-card bg-white rounded-[2.5rem] p-7 flex flex-col relative";
                    card.innerHTML = `
                        <div class="absolute top-6 left-6 z-20">
                            <i id="heart-${app.trackId}" onclick="toggleFavorite('${app.trackId}', '${app.trackName.replace(/'/g, "")}', '${app.artworkUrl100}')" 
                               class="${isFav ? 'fas' : 'far'} fa-heart fav-heart text-2xl" style="color: ${isFav ? '#10b981' : '#d1d5db'}"></i>
                        </div>
                        <div class="flex justify-center mb-6 relative">
                            <img src="${app.artworkUrl100}" class="app-icon">
                            <div class="absolute -right-3 top-0">
                                <button onclick="toggleShare(event, ${i})" class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center shadow-sm"><i class="fas fa-share-alt"></i></button>
                                <div id="menu-${i}" class="share-menu border">
                                    <button class="w-full text-left text-[11px] font-bold p-3 border-b hover:bg-emerald-50" onclick="copy('${app.trackViewUrl}')">iOS Link</button>
                                    <button class="w-full text-left text-[11px] font-bold p-3 hover:bg-emerald-50" onclick="copy('https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}')">Play Link</button>
                                </div>
                            </div>
                        </div>
                        <h3 class="font-black text-gray-800 text-center mb-8 truncate text-base px-2">${app.trackName}</h3>
                        <div class="grid gap-3">
                            <a href="${app.trackViewUrl}" target="_blank" class="flex items-center justify-center gap-2 bg-gray-900 text-white py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest hover:scale-[1.02] transition-transform"><i class="fab fa-apple text-base"></i> App Store</a>
                            <a href="https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}&c=apps" target="_blank" class="flex items-center justify-center gap-2 bg-emerald-50 border-2 border-emerald-100 text-emerald-700 py-3.5 rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-emerald-100 transition-colors"><i class="fab fa-google-play"></i> Google Play</a>
                        </div>`;
                    grid.appendChild(card);
                });
            } catch (e) { loader.classList.add('hidden'); }
        }

        function toggleShare(e, i) { e.stopPropagation(); const m = document.getElementById(`menu-${i}`); document.querySelectorAll('.share-menu').forEach(menu => menu !== m && menu.classList.remove('active')); m.classList.toggle('active'); }
        function copy(url) { navigator.clipboard.writeText(url); alert("Link Copied! 🥬"); }
        window.onclick = () => document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active'));
    </script>
</body>
</html>
