<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .app-card:hover { transform: translateY(-5px); transition: 0.3s; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-2xl font-black text-blue-600 flex items-center gap-2">
                <i class="fas fa-rocket"></i> AppHub
            </div>
            <div class="hidden md:flex gap-6 text-gray-600 font-medium">
                <a href="#" class="hover:text-blue-600">Browse</a>
                <a href="#" class="hover:text-blue-600">Categories</a>
                <a href="#" class="hover:text-blue-600">Top Charts</a>
            </div>
        </div>
    </nav>

    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 py-16 px-4">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Find Any App. Anywhere.</h1>
            <p class="text-blue-100 mb-8">Search across iOS and Android stores simultaneously.</p>
            
            <div class="max-w-2xl mx-auto flex bg-white rounded-full shadow-2xl overflow-hidden p-1">
                <input id="searchInput" type="text" placeholder="Search for 'Instagram' or 'Minecraft'..." 
                    class="w-full px-6 py-3 text-gray-800 outline-none text-lg">
                <button onclick="searchApps()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-bold transition">
                    Search
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto py-12 px-4">
        <div id="loading" class="hidden flex justify-center py-10">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
        
        <div id="welcomeMessage" class="text-center py-20 text-gray-400">
            <i class="fas fa-search text-6xl mb-4"></i>
            <p class="text-xl">Type an app name above to see the magic.</p>
        </div>
    </main>

    <script>
        async function searchApps() {
            const query = document.getElementById('searchInput').value;
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            const welcome = document.getElementById('welcomeMessage');

            if (!query) return;

            // UI Feedback
            grid.innerHTML = '';
            welcome.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                // Using iTunes API (Includes most major apps)
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=software&limit=12`);
                const data = await response.json();
                
                loader.classList.add('hidden');

                if (data.results.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-500">No apps found. Try another keyword!</p>';
                    return;
                }

                data.results.forEach(app => {
                    const card = document.createElement('div');
                    card.className = "app-card bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex flex-col items-center text-center";
                    
                    // Logic to simulate finding the Android equivalent
                    // In a production app, you would use a backend to match package names
                    const playStoreUrl = `https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}&c=apps`;
                    
                    card.innerHTML = `
                        <img src="${app.artworkUrl100}" class="w-24 h-24 rounded-3xl shadow-lg mb-4" alt="Icon">
                        <h3 class="font-bold text-gray-900 text-lg line-clamp-1">${app.trackName}</h3>
                        <p class="text-gray-500 text-sm mb-4 line-clamp-2">${app.description.substring(0, 60)}...</p>
                        
                        <div class="mt-auto w-full pt-4 border-t flex justify-around">
                            <a href="${app.trackViewUrl}" target="_blank" class="flex flex-col items-center group">
                                <i class="fab fa-apple text-2xl text-gray-400 group-hover:text-blue-500"></i>
                                <span class="text-[10px] text-gray-400 uppercase font-bold">App Store</span>
                            </a>
                            <a href="${playStoreUrl}" target="_blank" class="flex flex-col items-center group">
                                <i class="fab fa-google-play text-2xl text-gray-400 group-hover:text-green-500"></i>
                                <span class="text-[10px] text-gray-400 uppercase font-bold">Play Store</span>
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching apps:", error);
                loader.classList.add('hidden');
                alert("Something went wrong. Check your connection.");
            }
        }

        // Allow 'Enter' key to trigger search
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchApps();
        });
    </script>
</body>
</html>
