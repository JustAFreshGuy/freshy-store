<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshy App Store | Fixed UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .app-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .fresh-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        
        /* THE FIX: Absolute positioning relative to the share button container */
        .share-container { position: absolute; top: 0; right: 0; z-index: 50; }
        
        .share-menu { 
            display: none; 
            position: absolute;
            right: 0; /* Snaps to the right edge of the share button */
            top: 3.5rem; /* Moves it exactly below the button */
            width: 180px; 
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid #f1f5f9;
            padding: 0.5rem;
            z-index: 100;
        }
        .share-menu.active { display: block; animation: popIn 0.2s ease-out; }
        
        .modal { display: none; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .modal.active { display: flex; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen" onload="loadTrending()">

    <header class="fresh-gradient pb-32 pt-10 px-4 shadow-2xl relative">
        <div class="container mx-auto max-w-5xl relative z-10">
            <div class="flex justify-between items-center mb-10">
                <div class="flex items-center gap-3">
                    <div class="bg-white p-2 rounded-xl shadow-lg"><i class="fas fa-leaf text-emerald-600 text-xl"></i></div>
                    <span class="text-xl font-extrabold text-white tracking-tight italic">Freshy</span>
                </div>
                <button onclick="toggleModal()" class="bg-white text-emerald-700 px-6 py-2 rounded-full font-bold text-sm shadow-lg">Submit App</button>
            </div>
            <div class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-white mb-8">Find Your Next Favorite.</h1>
                <div class="max-w-2xl mx-auto flex bg-white rounded-3xl shadow-2xl overflow-hidden p-2">
                    <input id="searchInput" type="text" placeholder="Search apps..." class="w-full px-6 py-4 text-gray-800 outline-none font-medium">
                    <button onclick="searchApps()" class="bg-emerald-600 text-white px-8 rounded-2xl font-bold">Find</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto -mt-16 px-4 pb-20 relative z-20">
        <h2 id="sectionTitle" class="text-white font-extrabold text-xl mb-6 ml-4"><i class="fas fa-fire-alt mr-2 text-orange-400"></i>Trending Today</h2>
        <div id="loading" class="hidden text-center py-20"><div class="inline-block w-16 h-16 border-8 border-emerald-100 border-t-emerald-500 rounded-full animate-spin"></div></div>
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <div id="submitModal" class="modal fixed inset-0 z-[100] items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl relative">
            <button onclick="toggleModal()" class="absolute top-6 right-6 text-gray-400"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-black text-emerald-800 mb-6 text-center">Submit Your App</h2>
            <form action="mailto:your@email.com" class="space-y-4">
                <input type="text" placeholder="App Name" class="w-full bg-gray-50 border-2 rounded-2xl px-4 py-3 outline-none">
                <input type="url" placeholder="Logo Link" class="w-full bg-gray-50 border-2 rounded-2xl px-4 py-3 outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="url" placeholder="iOS Link" class="w-full bg-gray-50 border-2 rounded-2xl px-4 py-3 outline-none">
                    <input type="url" placeholder="Android Link" class="w-full bg-gray-50 border-2 rounded-2xl px-4 py-3 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold">Submit</button>
            </form>
        </div>
    </div>

    <script>
        function toggleModal() { document.getElementById('submitModal').classList.toggle('active'); }

        async function loadTrending() { renderApps(`https://itunes.apple.com/us/rss/newapplications/limit=8/json`, true); }

        async function searchApps() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            document.getElementById('sectionTitle').innerHTML = `Results for "${query}"`;
            renderApps(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=software&limit=16`, false);
        }

        async function renderApps(apiUrl, isRSS) {
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            grid.innerHTML = ''; loader.classList.remove('hidden');

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                loader.classList.add('hidden');
                const apps = isRSS ? data.feed.entry : data.results;

                apps.forEach((app, index) => {
                    const name = isRSS ? app['im:name'].label : app.trackName;
                    const icon = isRSS ? app['im:image'][2].label : app.artworkUrl100;
                    const viewUrl = isRSS ? app.link.attributes.href : app.trackViewUrl;
                    const genre = isRSS ? app.category.attributes.label : app.primaryGenreName;
                    const playLink = `https://play.google.com/store/search?q=${encodeURIComponent(name)}&c=apps`;
                    
                    const card = document.createElement('div');
                    card.className = "app-card bg-white rounded-[2.5rem] p-6 shadow-xl border border-emerald-50 flex flex-col relative";
                    card.innerHTML = `
                        <div class="relative mb-6 text-center">
                            <img src="${icon}" class="w-24 h-24 rounded-[2.2rem] shadow-xl mx-auto border-4 border-white" alt="Icon">
                            
                            <div class="share-container">
                                <button onclick="toggleMenu(${index})" class="bg-emerald-50 text-emerald-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-sm">
                                    <i class="fas fa-share-nodes"></i>
                                </button>
                                <div id="menu-${index}" class="share-menu">
                                    <p class="text-[9px] font-black text-gray-400 px-3 py-1 uppercase">Copy Link</p>
                                    <button onclick="copyLink('${viewUrl}', 'iOS')" class="w-full text-left px-3 py-2 hover:bg-emerald-50 rounded-lg text-sm font-bold flex items-center justify-between">
                                        <span><i class="fab fa-apple mr-2"></i>iOS</span>
                                        <i class="far fa-copy text-gray-300"></i>
                                    </button>
                                    <button onclick="copyLink('${playLink}', 'Android')" class="w-full text-left px-3 py-2 hover:bg-emerald-50 rounded-lg text-sm font-bold flex items-center justify-between">
                                        <span><i class="fab fa-google-play mr-2 text-emerald-500"></i>Android</span>
                                        <i class="far fa-copy text-gray-300"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mb-6 flex-1">
                            <h3 class="font-extrabold text-gray-800 text-lg truncate px-2">${name}</h3>
                            <p class="text-emerald-500 font-bold text-[10px] uppercase tracking-widest mt-1">${genre}</p>
                        </div>
                        <div class="mt-auto space-y-3">
                            <a href="${viewUrl}" target="_blank" class="flex items-center justify-center gap-3 bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-lg text-sm"><i class="fab fa-apple text-lg"></i> App Store</a>
                            <a href="${playLink}" target="_blank" class="flex items-center justify-center gap-3 bg-white border-2 border-emerald-100 text-emerald-700 py-4 rounded-2xl font-bold hover:bg-emerald-50 text-sm"><i class="fab fa-google-play text-lg text-emerald-500"></i> Google Play</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) { loader.classList.add('hidden'); }
        }

        function toggleMenu(index) {
            const menu = document.getElementById(`menu-${index}`);
            const isActive = menu.classList.contains('active');
            document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active'));
            if (!isActive) menu.classList.add('active');
        }

        function copyLink(url, type) {
            navigator.clipboard.writeText(url);
            alert(`Copied ${type} link!📋`);
            document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active'));
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchApps(); });
    </script>
</body>
</html>
