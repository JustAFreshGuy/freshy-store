<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshy App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .fresh-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .app-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; position: relative; }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); }
        .app-icon { width: 85px; height: 85px; border-radius: 20px; object-fit: cover; border: 3px solid white; box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .modal { display: none; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); }
        .modal.active { display: flex; }
        .share-menu { display: none; position: absolute; right: 0; top: 40px; width: 160px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 50; }
        .share-menu.active { display: block; }
    </style>
</head>
<body onload="initApp()">

    <header class="fresh-gradient pb-24 pt-8 px-4 text-white">
        <div class="container mx-auto max-w-5xl flex justify-between items-center mb-10">
            <div class="flex items-center gap-2">
                <div class="bg-white p-2 rounded-xl"><i class="fas fa-layer-group text-emerald-600 text-lg"></i></div>
                <span class="text-xl font-extrabold tracking-tight uppercase">Freshy App Store</span>
            </div>
            <div id="authSection">
                <button onclick="toggleAuthModal()" class="bg-white text-emerald-700 px-6 py-2 rounded-full font-bold text-sm">Login</button>
            </div>
        </div>
        <div class="text-center">
            <div class="max-w-lg mx-auto flex bg-white rounded-2xl shadow-xl p-1.5 border border-white/20">
                <input id="searchInput" type="text" placeholder="Search for any app..." class="w-full px-5 py-2 text-gray-800 outline-none font-medium">
                <button onclick="searchApps()" class="bg-emerald-600 text-white px-6 rounded-xl font-bold">Search</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto -mt-10 px-4 pb-20">
        <div id="loading" class="hidden text-center py-10"><i class="fas fa-circle-notch fa-spin text-3xl text-emerald-500"></i></div>
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="favDrawer" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl z-[200] transform translate-x-full transition-transform duration-300 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-slate-800">Favorites</h2>
            <button onclick="toggleFavDrawer()" class="text-gray-400"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="favList" class="grid gap-3"></div>
    </div>
    <div id="drawerOverlay" onclick="toggleFavDrawer()" class="fixed inset-0 bg-slate-900/40 z-[190] hidden"></div>

    <div id="authModal" class="modal fixed inset-0 z-[210] items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 shadow-2xl text-center">
            <h2 class="text-2xl font-black mb-6">Welcome</h2>
            <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 border-2 border-slate-100 py-3 rounded-xl font-bold mb-4 hover:bg-slate-50 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> Google Login
            </button>
            <div class="py-2 opacity-30 text-xs font-bold uppercase tracking-widest mb-4">or</div>
            <input id="authEmail" type="email" placeholder="Email Address" class="w-full bg-slate-50 border-0 rounded-xl px-4 py-3 mb-3 outline-none text-center font-bold">
            <button onclick="handleEmailLogin()" id="loginBtn" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-lg">Email Magic Link</button>
            <p id="authMsg" class="mt-4 text-[10px] text-emerald-600 font-bold"></p>
            <button onclick="toggleAuthModal()" class="mt-4 text-slate-400 text-xs font-bold uppercase">Close</button>
        </div>
    </div>

    <script>
        // --- 🛡️ GITHUB PROTECTION: BROKEN KEY ---
        const p1 = "AIzaSyDN39buxTWf_p2";
        const p2 = "MLNMvSZwNwP8ivlhRo7M";

        const firebaseConfig = {
            apiKey: p1 + p2,
            authDomain: "freshy-store-123.firebaseapp.com",
            projectId: "freshy-store-123",
            storageBucket: "freshy-store-123.firebasestorage.app",
            messagingSenderId: "686226406887",
            appId: "1:686226406887:web:403fcccb78540a5de0d142"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let userFavorites = [];

        async function initApp() {
            // 🔗 MAGIC LINK CATCHER
            if (auth.isSignInWithEmailLink(window.location.href)) {
                let email = window.localStorage.getItem('emailForSignIn') || window.prompt('Confirm email:');
                try {
                    await auth.signInWithEmailLink(email, window.location.href);
                    window.localStorage.removeItem('emailForSignIn');
                } catch (e) { alert("Invalid or expired link."); }
            }

            auth.onAuthStateChanged(async user => {
                const authSec = document.getElementById('authSection');
                if (user) {
                    authSec.innerHTML = `
                        <button onclick="toggleFavDrawer()" class="flex items-center gap-2 bg-white/20 p-1 pr-3 rounded-full border border-white/30">
                            <img src="${user.photoURL || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full border border-white">
                            <span class="text-[10px] font-black uppercase tracking-tighter">My Account</span>
                        </button>`;
                    const snap = await db.collection('users').doc(user.uid).collection('favorites').get();
                    userFavorites = snap.docs.map(doc => doc.id);
                } else {
                    authSec.innerHTML = `<button onclick="toggleAuthModal()" class="bg-white text-emerald-700 px-6 py-2 rounded-full font-bold text-sm">Login</button>`;
                }
                searchApps();
            });
        }

        async function handleGoogleLogin() { try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); toggleAuthModal(); } catch (e) { console.error(e); } }
        
        async function handleEmailLogin() {
            const email = document.getElementById('authEmail').value;
            const btn = document.getElementById('loginBtn');
            if(!email) return;
            btn.disabled = true; btn.innerText = "Sending...";
            try {
                await auth.sendSignInLinkToEmail(email, { url: window.location.href, handleCodeInApp: true });
                window.localStorage.setItem('emailForSignIn', email);
                document.getElementById('authMsg').innerText = "Check your inbox for the link!";
            } catch (e) { btn.disabled = false; btn.innerText = "Error. Try again."; }
        }

        function handleLogout() { auth.signOut().then(() => window.location.reload()); }
        function toggleAuthModal() { document.getElementById('authModal').classList.toggle('active'); }
        function toggleFavDrawer() {
            document.getElementById('favDrawer').classList.toggle('translate-x-full');
            document.getElementById('drawerOverlay').classList.toggle('hidden');
            if(!document.getElementById('favDrawer').classList.contains('translate-x-full')) renderFavList();
        }

        async function renderFavList() {
            const list = document.getElementById('favList');
            const user = auth.currentUser;
            if (!user) return;
            const snap = await db.collection('users').doc(user.uid).collection('favorites').get();
            if (snap.empty) { list.innerHTML = `<p class="text-xs text-slate-400 text-center py-10">No favorites saved.</p>`; return; }
            list.innerHTML = snap.docs.map(doc => `
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <img src="${doc.data().icon}" class="w-10 h-10 rounded-lg">
                    <div class="flex-grow min-w-0"><p class="text-xs font-bold truncate">${doc.data().name}</p>
                    <button onclick="toggleFavorite('${doc.id}', '${doc.data().name}', '${doc.data().icon}')" class="text-[9px] font-black text-red-500 uppercase">Remove</button></div>
                </div>`).join('');
            list.innerHTML += `<button onclick="handleLogout()" class="mt-4 w-full py-2 bg-slate-100 text-slate-500 text-[10px] font-black rounded-lg">LOGOUT</button>`;
        }

        async function toggleFavorite(appId, name, icon) {
            const user = auth.currentUser;
            if (!user) { toggleAuthModal(); return; }
            const ref = db.collection('users').doc(user.uid).collection('favorites').doc(appId.toString());
            if (userFavorites.includes(appId.toString())) {
                await ref.delete();
                userFavorites = userFavorites.filter(id => id !== appId.toString());
            } else {
                await ref.set({ name, icon, date: new Date() });
                userFavorites.push(appId.toString());
            }
            searchApps(); renderFavList();
        }

        async function searchApps() {
            const q = document.getElementById('searchInput').value || 'apps';
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            grid.innerHTML = ''; loader.classList.remove('hidden');
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=software&limit=12`);
                const data = await res.json();
                loader.classList.add('hidden');
                data.results.forEach((app, i) => {
                    const isFav = userFavorites.includes(app.trackId.toString());
                    const card = document.createElement('div');
                    card.className = "app-card bg-white rounded-3xl p-6 flex flex-col";
                    card.innerHTML = `
                        <div class="absolute top-4 left-4 z-20">
                            <i onclick="toggleFavorite('${app.trackId}', '${app.trackName.replace(/'/g, "")}', '${app.artworkUrl100}')" 
                               class="${isFav ? 'fas' : 'far'} fa-heart text-xl cursor-pointer" style="color: ${isFav ? '#ef4444' : '#cbd5e1'}"></i>
                        </div>
                        <div class="flex justify-center mb-4 relative">
                            <img src="${app.artworkUrl100}" class="app-icon">
                            <button onclick="toggleShare(event, ${i})" class="absolute -right-2 top-0 w-8 h-8 bg-slate-100 rounded-full text-xs"><i class="fas fa-share-alt"></i></button>
                            <div id="menu-${i}" class="share-menu border text-[10px] font-bold p-2">
                                <button class="w-full text-left p-2 border-b" onclick="copy('${app.trackViewUrl}')">iOS Link</button>
                                <button class="w-full text-left p-2" onclick="copy('https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}')">Play Link</button>
                            </div>
                        </div>
                        <h3 class="font-bold text-center mb-6 truncate text-sm uppercase tracking-tight">${app.trackName}</h3>
                        <div class="grid gap-2">
                            <a href="${app.trackViewUrl}" target="_blank" class="bg-slate-900 text-white py-3 rounded-xl text-[10px] font-bold uppercase text-center tracking-widest">App Store</a>
                            <a href="https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}&c=apps" target="_blank" class="border-2 border-emerald-100 text-emerald-700 py-2.5 rounded-xl text-[10px] font-bold uppercase text-center tracking-widest">Google Play</a>
                        </div>`;
                    grid.appendChild(card);
                });
            } catch (e) { loader.classList.add('hidden'); }
        }

        function toggleShare(e, i) { e.stopPropagation(); const m = document.getElementById(`menu-${i}`); document.querySelectorAll('.share-menu').forEach(menu => menu !== m && menu.classList.remove('active')); m.classList.toggle('active'); }
        function copy(url) { navigator.clipboard.writeText(url); alert("Link copied!"); }
        window.onclick = () => document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active'));
    </script>
</body>
</html>
