<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshy Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; scroll-behavior: smooth; }
        .fresh-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        header { position: sticky; top: 0; z-index: 100; transition: 0.3s; }
        .header-scrolled { padding: 1rem 0 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .app-card { transition: 0.3s; border: 1px solid #e2e8f0; background: white; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; position: relative; }
        .app-icon { width: 80px; height: 80px; border-radius: 18px; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin: 0 auto 16px; }
        .modal { display: none; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); position: fixed; inset: 0; z-index: 210; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .share-menu { display: none; position: absolute; right: 0; top: 45px; width: 150px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 100; border: 1px solid #f1f5f9; }
        .share-menu.active { display: block; }
    </style>
</head>
<body onload="initApp()">

    <header id="mainHeader" class="fresh-gradient pb-20 pt-8 px-4 text-white">
        <div class="container mx-auto max-w-5xl flex justify-between items-center mb-8">
            <div class="flex items-center gap-2">
                <div class="bg-white p-2 rounded-xl"><i class="fas fa-layer-group text-emerald-600"></i></div>
                <span class="text-xl font-black uppercase tracking-tight">Freshy Store</span>
            </div>
            <div id="authSection"></div>
        </div>
        <div class="max-w-lg mx-auto flex bg-white rounded-2xl p-1.5 shadow-xl">
            <input id="searchInput" type="text" placeholder="Search apps..." class="w-full px-5 text-gray-800 outline-none font-bold" onkeypress="if(event.key==='Enter') newSearch()">
            <button onclick="newSearch()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold">Search</button>
        </div>
    </header>

    <main class="container mx-auto mt-10 px-4 pb-20">
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div id="loading" class="hidden text-center py-10"><i class="fas fa-spinner fa-spin text-2xl text-emerald-500"></i></div>
        <div id="paginationArea" class="hidden text-center mt-12 mb-20">
            <button onclick="loadMore()" class="bg-white border-2 border-emerald-100 text-emerald-700 px-10 py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-emerald-50">See More</button>
        </div>
    </main>

    <button id="scrollTopBtn" onclick="window.scrollTo({top:0, behavior:'smooth'})" class="fixed bottom-8 right-8 w-14 h-14 bg-emerald-600 text-white rounded-2xl shadow-2xl flex items-center justify-center translate-y-20 opacity-0 z-[150] transition-all duration-300"><i class="fas fa-arrow-up"></i></button>

    <div id="authModal" class="modal">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 text-center">
            <h2 class="text-2xl font-black mb-8 text-slate-800">Login</h2>
            <button onclick="login('google')" class="w-full flex items-center justify-center gap-3 border-2 border-slate-100 py-4 rounded-2xl font-bold mb-4">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> Google
            </button>
            <button onclick="login('github')" class="w-full flex items-center justify-center gap-3 bg-[#24292f] text-white py-4 rounded-2xl font-bold mb-8">
                <i class="fab fa-github text-xl"></i> GitHub
            </button>
            <button onclick="toggleAuthModal()" class="text-slate-400 text-xs font-bold uppercase">Cancel</button>
        </div>
    </div>

    <script>
        const { Client, Account } = Appwrite;
        const client = new Client()
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject('freshy-store');

        const account = new Account(client);
        let currentOffset = 0;
        const limit = 12;

        async function initApp() {
            try {
                const user = await account.get();
                document.getElementById('authSection').innerHTML = `
                    <div class="flex items-center gap-2 bg-white/20 p-1 rounded-full pr-4 border border-white/30">
                        <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center font-bold border border-white">${user.name[0]}</div>
                        <span class="text-[10px] font-black uppercase cursor-pointer" onclick="logout()">Logout</span>
                    </div>`;
            } catch (e) {
                document.getElementById('authSection').innerHTML = `<button onclick="toggleAuthModal()" class="bg-white text-emerald-700 px-6 py-2 rounded-full font-bold text-sm">Login</button>`;
            }
            newSearch();
        }

        function login(provider) {
            // Using window.location.origin to fix the "success" redirect error on phone
            const redirect = window.location.origin + window.location.pathname;
            account.createOAuth2Session(provider, redirect, redirect);
        }

        async function logout() { await account.deleteSession('current'); window.location.reload(); }
        function toggleAuthModal() { document.getElementById('authModal').classList.toggle('active'); }

        function newSearch() { currentOffset = 0; document.getElementById('resultsGrid').innerHTML = ''; searchApps(); }
        function loadMore() { currentOffset += limit; searchApps(); }

        async function searchApps() {
            const q = document.getElementById('searchInput').value || 'apps';
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            const pag = document.getElementById('paginationArea');
            
            loader.classList.remove('hidden');
            pag.classList.add('hidden');

            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=software&limit=${limit}&offset=${currentOffset}`);
                const data = await res.json();
                
                data.results.forEach((app, i) => {
                    const id = `app-${currentOffset}-${i}`;
                    const card = document.createElement('div');
                    card.className = "app-card";
                    card.innerHTML = `
                        <div class="mb-4 flex justify-end">
                            <button onclick="toggleShare(event, '${id}')" class="w-9 h-9 bg-slate-50 border border-slate-100 rounded-xl text-slate-400"><i class="fas fa-share-alt"></i></button>
                            <div id="menu-${id}" class="share-menu">
                                <button class="w-full text-left p-3 border-b hover:bg-slate-50 text-[10px] font-bold" onclick="copy('${app.trackViewUrl}')">iOS LINK</button>
                                <button class="w-full text-left p-3 hover:bg-slate-50 text-[10px] font-bold" onclick="copy('https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}')">ANDROID LINK</button>
                            </div>
                        </div>
                        <img src="${app.artworkUrl100}" class="app-icon">
                        <h3 class="font-black text-center mb-6 truncate text-sm uppercase text-slate-800">${app.trackName}</h3>
                        <div class="grid gap-2 mt-auto">
                            <a href="${app.trackViewUrl}" target="_blank" class="bg-slate-900 text-white py-3 rounded-xl text-[10px] font-black uppercase text-center tracking-widest">App Store</a>
                            <a href="https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}&c=apps" target="_blank" class="border-2 border-emerald-100 text-emerald-700 py-2.5 rounded-xl text-[10px] font-black uppercase text-center tracking-widest">Google Play</a>
                        </div>`;
                    grid.appendChild(card);
                });
                
                loader.classList.add('hidden');
                if(data.results.length === limit) pag.classList.remove('hidden');
            } catch (e) { loader.classList.add('hidden'); }
        }

        window.onscroll = function() {
            const h = document.getElementById("mainHeader");
            const b = document.getElementById("scrollTopBtn");
            if (window.pageYOffset > 100) h.classList.add("header-scrolled"); else h.classList.remove("header-scrolled");
            if (window.pageYOffset > 400) { b.classList.remove("translate-y-20", "opacity-0"); b.classList.add("translate-y-0", "opacity-100"); } 
            else { b.classList.add("translate-y-20", "opacity-0"); b.classList.remove("translate-y-0", "opacity-100"); }
        };

        function toggleShare(e, id) { e.stopPropagation(); const m = document.getElementById(`menu-${id}`); document.querySelectorAll('.share-menu').forEach(x => x !== m && x.classList.remove('active')); m.classList.toggle('active'); }
        function copy(url) { navigator.clipboard.writeText(url); alert("Copied!"); }
        window.onclick = (e) => { if (!e.target.closest('.share-menu')) document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active')); };
    </script>
</body>
</html>
