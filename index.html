<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshy App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0fdf4; }
        .fresh-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .icon-wrapper { display: flex; justify-content: center; align-items: center; margin-bottom: 1.5rem; position: relative; }
        .app-icon { width: 95px; height: 95px; border-radius: 22px; box-shadow: 0 10px 20px rgba(5, 150, 105, 0.2); border: 4px solid white; }
        .share-container { position: absolute; top: 0; right: 0; }
        .share-btn { background: #d1fae5; color: #065f46; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .share-menu { display: none; position: absolute; right: 0; top: 45px; width: 170px; background: white; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); border: 1px solid #e2e8f0; z-index: 100; overflow: hidden; }
        .share-menu.active { display: block; }
        .share-item { width: 100%; text-align: left; padding: 12px 16px; font-size: 13px; font-weight: 700; color: #1e293b; border-bottom: 1px solid #f1f5f9; }
        .modal { display: none; background: rgba(6, 78, 59, 0.4); backdrop-filter: blur(10px); }
        .modal.active { display: flex; }
    </style>
</head>
<body onload="initApp()">

    <header class="fresh-gradient pb-32 pt-10 px-4 shadow-2xl relative text-white text-center">
        <div class="container mx-auto max-w-5xl">
            <div class="flex justify-between items-center mb-12">
                <div class="flex items-center gap-3">
                    <div class="bg-white p-2 rounded-xl"><i class="fas fa-leaf text-emerald-600 text-xl"></i></div>
                    <span class="text-2xl font-black italic">Freshy</span>
                </div>
                <div id="authSection">
                    <button onclick="toggleAuthModal()" class="bg-white text-emerald-700 px-8 py-2.5 rounded-full font-extrabold text-sm shadow-xl">Login</button>
                </div>
            </div>
            <h1 class="text-4xl font-black mb-8 italic">Freshy <span class="text-emerald-200">Store</span></h1>
            <div class="max-w-xl mx-auto flex bg-white rounded-2xl shadow-2xl overflow-hidden p-2">
                <input id="searchInput" type="text" placeholder="Search for apps..." class="w-full px-6 py-3 text-gray-800 outline-none font-semibold">
                <button onclick="searchApps()" class="bg-emerald-600 text-white px-8 rounded-xl font-bold">Find</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto -mt-16 px-4 pb-24 z-20 relative">
        <div id="loading" class="hidden text-center py-20"><div class="inline-block w-12 h-12 border-4 border-white border-t-emerald-500 rounded-full animate-spin"></div></div>
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="authModal" class="modal fixed inset-0 z-[100] items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-10 shadow-2xl relative text-center">
            <button onclick="toggleAuthModal()" class="absolute top-6 right-6 text-gray-400"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-black text-gray-800 mb-6 italic">Freshy Login</h2>
            
            <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-100 py-3 rounded-2xl font-bold text-gray-600 shadow-sm hover:bg-gray-50 mb-4 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                Google Login
            </button>

            <div class="flex items-center my-4 text-gray-300 text-xs font-bold uppercase tracking-widest">
                <hr class="flex-grow border-gray-100"> <span class="px-3">or</span> <hr class="flex-grow border-gray-100">
            </div>

            <input id="authEmail" type="email" placeholder="Email Address" class="w-full bg-emerald-50 border-2 border-emerald-50 rounded-2xl px-4 py-4 mb-4 outline-none text-center font-bold text-sm">
            <button onclick="handleEmailLogin()" id="loginBtn" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg">Send Magic Link 🪄</button>
            <p id="authMsg" class="mt-4 text-xs font-bold text-emerald-600"></p>
        </div>
    </div>

    <script>
        // YOUR FIREBASE KEYS LOADED
        const firebaseConfig = {
            apiKey: "AIzaSyDN39buxTWf_p2MLNMvSZwNwP8ivlhRo7M",
            authDomain: "freshy-store-123.firebaseapp.com",
            projectId: "freshy-store-123",
            storageBucket: "freshy-store-123.firebasestorage.app",
            messagingSenderId: "686226406887",
            appId: "1:686226406887:web:403fcccb78540a5de0d142"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function initApp() {
            auth.onAuthStateChanged(user => {
                const authSec = document.getElementById('authSection');
                if (user) {
                    authSec.innerHTML = `
                        <div class="flex items-center gap-2 bg-white/20 p-1 px-3 rounded-full">
                            <img src="${user.photoURL || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full border-2 border-white">
                            <button onclick="handleLogout()" class="text-white font-black text-[10px] uppercase">Exit</button>
                        </div>`;
                } else {
                    authSec.innerHTML = `<button onclick="toggleAuthModal()" class="bg-white text-emerald-700 px-8 py-2.5 rounded-full font-extrabold text-sm">Login</button>`;
                }
            });
            renderApps(`https://itunes.apple.com/search?term=apps&entity=software&limit=9`, false);
        }

        async function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
                toggleAuthModal();
            } catch (e) { document.getElementById('authMsg').innerText = "Auth Failed"; }
        }

        async function handleEmailLogin() {
            const email = document.getElementById('authEmail').value;
            const actionCodeSettings = { url: window.location.href, handleCodeInApp: true };
            try {
                await auth.sendSignInLinkToEmail(email, actionCodeSettings);
                window.localStorage.setItem('emailForSignIn', email);
                document.getElementById('authMsg').innerText = "Check your email! 📧";
            } catch (e) { document.getElementById('authMsg').innerText = e.message; }
        }

        function handleLogout() { auth.signOut().then(() => window.location.reload()); }
        function toggleAuthModal() { document.getElementById('authModal').classList.toggle('active'); }

        async function renderApps(url, isRSS) {
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            grid.innerHTML = ''; loader.classList.remove('hidden');
            try {
                const res = await fetch(url);
                const data = await res.json();
                loader.classList.add('hidden');
                const apps = isRSS ? data.feed.entry : data.results;
                apps.forEach((app, i) => {
                    const name = isRSS ? app['im:name'].label : app.trackName;
                    const icon = isRSS ? app['im:image'][2].label : app.artworkUrl100;
                    const appleUrl = isRSS ? app.link.attributes.href : app.trackViewUrl;
                    const googleUrl = `https://play.google.com/store/search?q=${encodeURIComponent(name)}&c=apps`;
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-[2.5rem] p-8 shadow-xl flex flex-col relative";
                    card.innerHTML = `
                        <div class="icon-wrapper"><img src="${icon}" class="app-icon">
                            <div class="share-container">
                                <button onclick="toggleShare(event, ${i})" class="share-btn shadow-sm"><i class="fas fa-share-nodes"></i></button>
                                <div id="menu-${i}" class="share-menu">
                                    <button class="share-item" onclick="copy('${appleUrl}')">iOS Link</button>
                                    <button class="share-item" onclick="copy('${googleUrl}')">Android Link</button>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mb-8 font-black text-gray-800 text-lg truncate px-2">${name}</div>
                        <div class="grid gap-3">
                            <a href="${appleUrl}" target="_blank" class="bg-slate-900 text-white py-3.5 rounded-2xl text-xs font-black uppercase text-center">App Store</a>
                            <a href="${googleUrl}" target="_blank" class="bg-emerald-50 border-2 border-emerald-100 text-emerald-700 py-3 rounded-2xl text-xs font-black uppercase text-center">Play Store</a>
                        </div>`;
                    grid.appendChild(card);
                });
            } catch (e) { loader.classList.add('hidden'); }
        }

        function toggleShare(e, i) {
            e.stopPropagation();
            const m = document.getElementById(`menu-${i}`);
            document.querySelectorAll('.share-menu').forEach(menu => menu !== m && menu.classList.remove('active'));
            m.classList.toggle('active');
        }

        function copy(url) { navigator.clipboard.writeText(url); alert("Copied! 🥬"); }
        async function searchApps() {
            const q = document.getElementById('searchInput').value;
            if(!q) return;
            renderApps(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=software&limit=12`, false);
        }
    </script>
</body>
</html>
